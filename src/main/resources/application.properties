# HTTP server
server.host=0.0.0.0
server.port=8080
server.backlog=1024

# Netty network I/O threads. These are separate from the tunable worker pool.
netty.bossThreads=1
netty.ioThreads=2

# Request-processing worker pool
worker.initialSize=10
worker.minSize=1
worker.maxSize=101
worker.queueCapacity=5000

# Initial smoke-test workload and policy
experiment.application=PRIME
experiment.policy=FIXED
experiment.fixedThreads=10

# ADAPT-T parameters from the paper
adapt.windowSeconds=10
adapt.stepSize=10
adapt.latencyThresholdPercent=5.0
adapt.incrementLockStages=6
adapt.decrementLockStages=6
adapt.objective=MEAN

# Adaptive-step ADAPT-T parameters
asAdapt.minPoolSize=1
asAdapt.maxPoolSize=100
asAdapt.minStepSize=1
asAdapt.maxStepSize=10
asAdapt.meanImprovementPercent=5.0
asAdapt.maxThroughputDegradationPercent=5.0
asAdapt.maxP99DegradationPercent=10.0
asAdapt.referenceWindows=3
asAdapt.changeDetectionWindows=3
asAdapt.meanChangePercent=10.0
asAdapt.p99ChangePercent=10.0
asAdapt.throughputChangePercent=10.0
asAdapt.queueGrowthPercent=10.0
asAdapt.queueAssistedMeanChangePercent=5.0
asAdapt.queueAssistedThroughputChangePercent=5.0
asAdapt.stableHoldingEnabled=true

# Transparent queue-length hysteresis baseline
queueBaseline.minPoolSize=1
queueBaseline.maxPoolSize=100
queueBaseline.stepSize=5
queueBaseline.lowQueueThreshold=0
queueBaseline.highQueueThreshold=5
queueBaseline.consecutiveWindows=2

# Prime1m input range
prime.lowerBound=999990
prime.upperBound=1000010

# DBRead dataset bounds
news.minId=1
news.maxId=1000000

# DBWrite inserts one durable auto-commit event per request.
dbwrite.eventType=benchmark
dbwrite.payloadBytes=3072

# Database password must be supplied with ADAPT_T_DB_PASSWORD.
database.jdbcUrl=jdbc:mysql://127.0.0.1:3306/adapt_t?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
database.username=adapt_t_app
database.maximumPoolSize=120
database.minimumIdle=10
database.connectionTimeoutMs=5000
database.validationTimeoutMs=3000
database.idleTimeoutMs=600000
database.maxLifetimeMs=1800000

# Metrics output
metrics.outputFile=results/windows.csv
metrics.highestTrackableLatencySeconds=300
